<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#178b70">
    <title>Cuanku sedang offline</title>
    <style>
      :root { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f5f7f7; color: #17201d; }
      main { max-width: 420px; margin: 24px; padding: 28px; border: 1px solid #dde6e2; border-radius: 18px; background: white; }
      h1 { margin-top: 0; font-size: 24px; }
      p { line-height: 1.6; color: #58665f; }
      a { display: inline-block; margin-top: 8px; padding: 12px 16px; border-radius: 10px; background: #178b70; color: white; font-weight: 700; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #111714; color: #edf4f0; }
        main { border-color: #304138; background: #19221e; }
        p { color: #9aa9a1; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Anda sedang offline</h1>
      <p>Cuanku belum dapat membuka halaman ini. Setelah koneksi pulih, data transaksi yang tersimpan di perangkat tetap dapat diakses.</p>
      <a href="/">Coba buka Cuanku</a>
    </main>
  </body>
</html>
